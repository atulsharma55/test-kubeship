# Managed by Kubeship — builds the "test-kubeship" service from this repo
# (Dockerfile) and pushes it to Artifact Registry via GitHub OIDC.
# One file per service: other services from this repo have their own.
name: "Kubeship · test-kubeship"
on:
  push:
    # Only the branch this service deploys from builds. Every branch used to:
    # a feature branch then failed at the registry login (Azure trusts the
    # service's branch alone), and elsewhere it overwrote :latest and spent
    # Actions minutes. Changing the branch in Kubeship rewrites this file.
    branches: ['main']
    # Order matters — a later pattern overrides an earlier one:
    #  - any change builds…
    #  - …except chart/config edits (deploy/**: they redeploy via ArgoCD)…
    #  - …and Kubeship's workflow files, which are one per service: before,
    #    writing one service's workflow (its Rebuild) built EVERY service in
    #    the repo…
    #  - …except THIS service's own file, so the commit that first adds it
    #    (with deploy/**) still starts this service's first build.
    paths:
      - '**'
      - '!deploy/**'
      - '!.github/workflows/kubeship-*.yml'
      - '.github/workflows/kubeship-test-kubeship.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label for this run only (empty: the KUBESHIP_RUNNER variable, else GitHub-hosted)'
        required: false
        default: ''
# A newer push (or Rebuild) cancels the build still running for an older one: only the newest commit is deployed.
# Kubeship's one-off run on another runner (inputs.runner, services/runner-fallback.ts) keeps a lane of its own, so it
# never cancels a real build, nor a real build it.
concurrency:
  group: kubeship-test-kubeship-${{ github.ref }}-${{ inputs.runner || 'build' }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  build:
    name: "build Dockerfile"
    # Clusters run arm64, so the image is built natively on GitHub's arm64
    # runner (available to private repositories since 2026-01-29), not under
    # QEMU emulation on x86 — emulation made every RUN step several times
    # slower, and EIP's PDF-export build was cancelled at the old 15 minutes.
    # KUBESHIP_RUNNER (repo or org variable) names a self-hosted arm64 runner
    # label to use instead, while GitHub-hosted runners won't start jobs. The
    # dispatch input lets Kubeship send one run to GitHub-hosted to test whether
    # they work again (services/runner-fallback.ts).
    runs-on: ${{ inputs.runner || vars.KUBESHIP_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # GitHub's runner has little free disk, and the image is held twice (the
      # local copy loaded for the scan, plus Trivy's own unpacked export). EIP's
      # image reached ~630MB compressed and every build died "no space left on
      # device". These preinstalled toolchains are unused here (~20GB).
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Log in to Google Cloud via OIDC
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351701789656/locations/global/workloadIdentityPools/kubeship-github/providers/github
          service_account: kubeship-gcp-push@fiftyfivetech.iam.gserviceaccount.com
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      # Kubeship build variables (managed from the portal). Public ones live as
      # repo Variables (KSB_TEST_KUBESHIP__*) → passed as --build-arg (declare a matching
      # ARG in your Dockerfile). Secret ones live as repo Secrets (KSB_TEST_KUBESHIP__*) →
      # BuildKit secret files (mounted only during RUN, never baked into image
      # layers). Prefix-based so the portal adds/removes vars without editing this.
      - name: Materialize Kubeship build variables
        id: ksvars
        env:
          KS_VARS: ${{ toJSON(vars) }}
          KS_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          mkdir -p .ksbuild-secrets
          BUILD_ARGS=""
          for k in $(echo "$KS_VARS" | jq -r 'keys[]'); do
            case "$k" in
              KSB_TEST_KUBESHIP__*)
                name="${k#KSB_TEST_KUBESHIP__}"
                val="$(echo "$KS_VARS" | jq -r --arg k "$k" '.[$k]')"
                BUILD_ARGS+="$name=$val"$'\n'
              ;;
            esac
          done
          SECRET_FILES=""
          for k in $(echo "$KS_SECRETS" | jq -r 'keys[]'); do
            case "$k" in
              KSB_TEST_KUBESHIP__*)
                name="${k#KSB_TEST_KUBESHIP__}"
                echo "$KS_SECRETS" | jq -r --arg k "$k" '.[$k]' > ".ksbuild-secrets/$name"
                SECRET_FILES+="$name=.ksbuild-secrets/$name"$'\n'
              ;;
            esac
          done
          {
            echo "buildargs<<KSEOF"; printf '%s' "$BUILD_ARGS"; echo "KSEOF"
            echo "secretfiles<<KSEOF"; printf '%s' "$SECRET_FILES"; echo "KSEOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push (arm64, Artifact Registry layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          # push to Artifact Registry AND load the built image into the runner's local Docker,
          # so the Trivy step scans it locally (no registry pull, no extra IAM).
          outputs: |
            type=registry
            type=docker
          build-args: ${{ steps.ksvars.outputs.buildargs }}
          secret-files: ${{ steps.ksvars.outputs.secretfiles }}
          # Remote layer cache stored in the same Artifact Registry repo (:buildcache) — makes
          # subsequent builds much faster. image-manifest+oci flags are
          # required for registry cache to work with ECR.
          cache-from: type=registry,ref=asia-south1-docker.pkg.dev/fiftyfivetech/kubeship/kubeship/test-kubeship/test-kubeship:buildcache
          cache-to: type=registry,ref=asia-south1-docker.pkg.dev/fiftyfivetech/kubeship/kubeship/test-kubeship/test-kubeship:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            asia-south1-docker.pkg.dev/fiftyfivetech/kubeship/kubeship/test-kubeship/test-kubeship:sha-${{ github.sha }}
            asia-south1-docker.pkg.dev/fiftyfivetech/kubeship/kubeship/test-kubeship/test-kubeship:latest
      # Cloud-independent vulnerability scan of the built image (Trivy). Reports
      # only — does not fail the build: exit-code '0' covers findings, and
      # continue-on-error covers the scanner itself crashing (it once ran out of
      # disk), which otherwise marked a build whose image was already pushed as
      # failed, so it was never deployed. Kubeship pulls trivy.json from the
      # run's artifacts and renders it on the service's Security tab.
      # Cache Trivy's vulnerability DB (~40MB) across runs so it isn't re-downloaded.
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Vulnerability scan (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
        with:
          # scans the locally-loaded image (from the build step above) — no pull
          image-ref: asia-south1-docker.pkg.dev/fiftyfivetech/kubeship/kubeship/test-kubeship/test-kubeship:sha-${{ github.sha }}
          version: v0.72.0
          format: json
          output: trivy.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-test-kubeship
          path: trivy.json
          retention-days: 30
